spring.application.name=todo-backend

# --- Database (테스트 전용: todolistdb_test 스키마) ---
# main의 application.properties를 상속하지 않으므로(테스트 properties가 shadow) DB_URL을 별도로 직접 지정한다
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres?currentSchema=todolistdb_test
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.default_schema=todolistdb_test
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate=info
logging.level.org.hibernate.SQL=debug

# --- JWT (테스트 전용 더미 시크릿 — 프로덕션에서 쓰이지 않음) ---
jwt.secret=test-only-jwt-secret-key-not-used-in-production-32bytes
jwt.expiration=86400000

# --- OAuth2 Kakao (테스트 전용 더미 값) ---
# 이 파일은 main properties를 shadow하므로 provider/registration 블록을 자립적으로 다시 적는다 (PRD 12.2, Task 007 메모)
spring.security.oauth2.client.provider.kakao.authorization-uri=https://kauth.kakao.com/oauth/authorize
spring.security.oauth2.client.provider.kakao.token-uri=https://kauth.kakao.com/oauth/token
spring.security.oauth2.client.provider.kakao.user-info-uri=https://kapi.kakao.com/v2/user/me
spring.security.oauth2.client.provider.kakao.user-name-attribute=id

spring.security.oauth2.client.registration.kakao.client-id=dummy-kakao-client-id
spring.security.oauth2.client.registration.kakao.client-secret=dummy-kakao-client-secret
spring.security.oauth2.client.registration.kakao.client-name=Kakao
spring.security.oauth2.client.registration.kakao.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.kakao.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.kakao.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.kakao.scope=profile_nickname,account_email
