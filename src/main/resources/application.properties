spring.application.name=todo-backend

# --- Database (PostgreSQL / 스키마: TodoListDB, 물리 식별자 todolistdb) ---
# URL·계정은 비민감 값이라 로컬 기본값을 둔다(CLAUDE.md 4장). 비밀번호만 진짜 시크릿이라 기본값 없음
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/postgres?currentSchema=todolistdb}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# --- JPA / Hibernate (ddl-auto는 프로파일별 파일에서 지정: dev=update / prod=validate) ---
spring.jpa.properties.hibernate.default_schema=todolistdb
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate=info
logging.level.org.hibernate.SQL=debug

# --- JWT (불변 규칙 4: Access Token 24시간 고정, Refresh Token 없음) ---
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# --- CORS / 프론트엔드 URL: 프로파일별 파일에서 지정한다 ---
# dev는 로컬 기본값을 허용하지만 prod는 운영 도메인을 명시적으로 요구한다 (application-dev/prod.properties 참조)

# --- OAuth2 Google: registration 블록 (provider는 CommonOAuth2Provider.GOOGLE에 내장돼 있어 생략 가능) ---
# OAUTH_GOOGLE_CLIENT_ID/SECRET 미설정 시 더미 값으로 폴백 — 기동만 되면 됨(Kakao와 동일한 패턴)
# ⚠️ scope에서 openid를 뺀다 — 포함하면 Spring Security가 OIDC 경로(oidcUserService)로 라우팅해
#    Kakao와 같은 커스텀 OAuth2UserService(userService)가 아예 호출되지 않는다 (Task 015 실측)
spring.security.oauth2.client.registration.google.client-id=${OAUTH_GOOGLE_CLIENT_ID:dummy-google-client-id}
spring.security.oauth2.client.registration.google.client-secret=${OAUTH_GOOGLE_CLIENT_SECRET:dummy-google-client-secret}
spring.security.oauth2.client.registration.google.scope=email,profile

# --- OAuth2 Kakao: provider 블록 (CommonOAuth2Provider에 내장되지 않아 수동 등록 필수, PRD 12.2) ---
spring.security.oauth2.client.provider.kakao.authorization-uri=https://kauth.kakao.com/oauth/authorize
spring.security.oauth2.client.provider.kakao.token-uri=https://kauth.kakao.com/oauth/token
spring.security.oauth2.client.provider.kakao.user-info-uri=https://kapi.kakao.com/v2/user/me
spring.security.oauth2.client.provider.kakao.user-name-attribute=id

# --- OAuth2 Kakao: registration 블록 (Google과 달리 기본값이 없어 전부 명시 필요) ---
# OAUTH_KAKAO_CLIENT_ID/SECRET 미설정 시 더미 값으로 폴백 — M3(소셜 로그인 구현) 착수 전까지는 기동만 되면 된다
spring.security.oauth2.client.registration.kakao.client-id=${OAUTH_KAKAO_CLIENT_ID:dummy-kakao-client-id}
spring.security.oauth2.client.registration.kakao.client-secret=${OAUTH_KAKAO_CLIENT_SECRET:dummy-kakao-client-secret}
spring.security.oauth2.client.registration.kakao.client-name=Kakao
spring.security.oauth2.client.registration.kakao.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.kakao.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.kakao.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.kakao.scope=profile_nickname,account_email