# 로컬 개발 프로파일. ddl-auto는 여기서만 정한다 (CLAUDE.md 4장: dev=update / prod=validate).
spring.jpa.hibernate.ddl-auto=update

# 프론트 dev 서버 기본 주소로 폴백 — 로컬에서 APP_FRONTEND_URL을 매번 지정하지 않아도 되게 함
app.frontend-url=${APP_FRONTEND_URL:http://localhost:3000}

# --- 첨부파일 스토리지: 로컬 디스크 (tiptap-s3-image-upload-prompt.md §5) ---
# base-dir 기본값은 todo-project/upload — todo-backend와 형제 레벨, 어느 저장소에도 커밋하지 않는다
app.storage.type=local
app.storage.local.base-dir=${LOCAL_UPLOAD_DIR:../upload}
app.storage.local.base-url=${APP_BACKEND_URL:http://localhost:8080}
app.storage.url-expiry-minutes=30
