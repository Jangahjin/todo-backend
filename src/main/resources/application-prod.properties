# 운영 프로파일. ddl-auto는 여기서만 정한다 (CLAUDE.md 4장: dev=update / prod=validate).
# validate — 운영에서는 Hibernate가 스키마를 자동으로 바꾸지 않는다. 마이그레이션은 별도로 관리한다.
spring.jpa.hibernate.ddl-auto=validate

# 운영 도메인은 기본값을 두지 않는다 — 반드시 APP_FRONTEND_URL 환경변수로 명시한다.
# 실제 운영 도메인 확정·CORS/Redirect URI 갱신은 M9(Task 039)에서 수행한다.
app.frontend-url=${APP_FRONTEND_URL}

# --- 첨부파일 스토리지: S3 (tiptap-s3-image-upload-prompt.md §5, §9) ---
# ⚠️ S3StorageService는 아직 구현되지 않았다 — 이 프로파일로 기동하면 StorageService 빈이
# 없어 컨텍스트 로딩에 실패한다. S3 전환(가이드 §9)을 완료한 뒤에만 prod로 기동한다.
app.storage.type=s3
app.storage.s3.bucket=${AWS_S3_BUCKET}
app.storage.s3.region=${AWS_REGION:ap-northeast-2}
app.storage.url-expiry-minutes=30
