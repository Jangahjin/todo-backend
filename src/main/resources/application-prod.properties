# 운영 프로파일. ddl-auto는 여기서만 정한다 (CLAUDE.md 4장: dev=update / prod=validate).
# validate — 운영에서는 Hibernate가 스키마를 자동으로 바꾸지 않는다. 마이그레이션은 별도로 관리한다.
spring.jpa.hibernate.ddl-auto=validate

# 운영 도메인은 기본값을 두지 않는다 — 반드시 APP_FRONTEND_URL 환경변수로 명시한다.
# 실제 운영 도메인 확정·CORS/Redirect URI 갱신은 M9(Task 039)에서 수행한다.
app.frontend-url=${APP_FRONTEND_URL}

# CloudFront 등 리버스 프록시 뒤에서 OAuth2 {baseUrl}이 프록시의 실제 도메인으로 계산되도록 한다.
# 프록시가 없어도(X-Forwarded-* 헤더 미수신 시) 원래 요청 값을 그대로 쓰므로 무해하다.
server.forward-headers-strategy=framework

# 운영에서는 SQL 파라미터가 journalctl에 평문으로 남지 않도록 낮춘다(공통 파일은 debug).
logging.level.org.hibernate.SQL=info

# --- t2.micro(1GB RAM) 메모리 예산 관리 ---
server.tomcat.threads.max=50
server.tomcat.threads.min-spare=10
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2

# --- 첨부파일 스토리지: S3 (tiptap-s3-image-upload-prompt.md §5, §9) ---
# AWS_S3_BUCKET 미설정 시 기동에 실패한다(기본값 없음). 자격증명은 프로퍼티가 아니라
# DefaultCredentialsProvider가 찾는다 — 환경변수·~/.aws·EC2 IAM Role 중 하나가 있어야 한다.
app.storage.type=s3
app.storage.s3.bucket=${AWS_S3_BUCKET}
app.storage.s3.region=${AWS_REGION:ap-northeast-2}
app.storage.url-expiry-minutes=30
