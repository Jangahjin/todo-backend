# journald 로그 rate-limit 드롭인 설정. /etc/systemd/journald.conf.d/todolist.conf 로 배치된다.
# 기본값(RateLimitIntervalSec=30s, RateLimitBurst=10000)이 낮아서, 기동 직후나 장애로
# 로그가 몰릴 때 systemd-journald가 초과분을 조용히 버릴 수 있다 — 그러면 journalctl로
# 원인 확인할 때 정작 필요한 로그가 없어서 디버깅이 막힌다. 여유를 넉넉히 둔다.
[Journal]
RateLimitIntervalSec=30s
RateLimitBurst=100000
